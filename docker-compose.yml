# Default mode: backend + frontend, MongoDB Atlas database (MONGODB_URI in backend/.env).
#   docker compose up --build
# The ${...} variables below are read from the .env file at the root (see .env.example).
name: redstore

services:
  backend:
    build: ./backend
    image: YOUR_DOCKERHUB_USERNAME/redstore-backend
    env_file: backend/.env
    environment:
      # Forced here to stay consistent with the frontend BACKEND_URL, regardless of the backend/.env value
      PORT: "1980"
      # Password-reset link: the app is served on port 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Only one proxy (Nginx) in front of the API locally
      TRUST_PROXY: "1"
    # No published port: the API is only reachable through Nginx (http://localhost:8080/api)
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    image: YOUR_DOCKERHUB_USERNAME/redstore-frontend
    ports:
      - "8080:80"
    environment:
      BACKEND_URL: http://backend:1980
    depends_on:
      - backend
    restart: unless-stopped
