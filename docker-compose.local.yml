# Override for working offline with a local MongoDB instead of Atlas:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    # No published port: Mongo is only accessible from the Docker network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    environment:
      # Code reads MONGODB_URI (config/connectDB.js): overrides Atlas value in backend/.env
      MONGODB_URI: mongodb://mongo:27017/redstore
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
