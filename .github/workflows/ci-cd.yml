name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel outdated runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default permissions.
permissions:
  contents: read

env:
  # Repository names only; SHA tags are appended in image jobs.
  BACKEND_IMAGE: hariish18/redstore-backend
  FRONTEND_IMAGE: hariish18/redstore-frontend

jobs:
  # 1. Frontend: install, lint and production build.
  lint-frontend:
    name: Lint and build frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # 2. Backend: tests, coverage, syntax and module-load checks.
  check-backend:
    name: Test and validate backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend

    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Get mongodb-memory-server version
        id: mongoms
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/mongodb-memory-server'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache mongod binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongoms-${{ runner.os }}-${{ steps.mongoms.outputs.version }}

      - name: Install backend dependencies
        run: npm ci

      # Tests should use in-memory MongoDB and mock external integrations.
      - name: Run tests and generate coverage
        run: npm run test:coverage

      - name: Upload backend coverage for SonarQube
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Check JavaScript syntax
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      # Modules should not initiate database or external service connections at import time.
      - name: Load backend modules
        run: |
          node -e "
          const fs = require('fs'), path = require('path');
          for (const d of ['config', 'util', 'model', 'middlewares', 'controller', 'routes']) {
            for (const f of fs.readdirSync(d).filter(f => f.endsWith('.js'))) {
              require(path.resolve(d, f));
              console.log('ok', d + '/' + f);
            }
          }
          "

  # 3. Snyk dependency vulnerability scanning.
  snyk:
    name: Snyk dependency scan
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Require SNYK_TOKEN before publishing from main
        if: env.SNYK_TOKEN == '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::SNYK_TOKEN is required before publishing images from main."
          exit 1

      - name: Notice when Snyk is skipped
        if: env.SNYK_TOKEN == '' && github.event_name != 'push'
        run: echo "::notice::SNYK_TOKEN is missing; Snyk scan skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SNYK_TOKEN != ''

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SNYK_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        if: env.SNYK_TOKEN != ''
        working-directory: ./backend
        run: npm ci --ignore-scripts

      - name: Install frontend dependencies
        if: env.SNYK_TOKEN != ''
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Scan backend dependencies
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/package.json --severity-threshold=high

      - name: Scan frontend dependencies
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=frontend/package.json --severity-threshold=high

  # 4. SonarQube Cloud: source code analysis and backend coverage import.
  sonarqube:
    name: SonarQube Cloud analysis
    needs: [lint-frontend, check-backend]
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Require SONAR_TOKEN before publishing from main
        if: env.SONAR_TOKEN == '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::SONAR_TOKEN is required before publishing images from main."
          exit 1

      - name: Notice when SonarQube is skipped
        if: env.SONAR_TOKEN == '' && github.event_name != 'push'
        run: echo "::notice::SONAR_TOKEN is missing; SonarQube scan skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Download backend coverage report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  # 5. Backend image: build locally, scan, then publish on push to main.
  build-scan-backend:
    name: Build, scan and publish backend image
    needs: [sonarqube, snyk]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short commit SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: false
          load: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.sha_short }}
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=redstore-backend
          cache-to: type=gha,mode=max,scope=redstore-backend

      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: '0'

      - name: Add backend Trivy report to summary
        if: always()
        run: |
          {
            echo "## Backend image: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "Report unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-backend-report
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Block fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
        run: docker push "$IMAGE_REF"

  # 6. Frontend image: build locally, scan, then publish on push to main.
  build-scan-frontend:
    name: Build, scan and publish frontend image
    needs: [sonarqube, snyk]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Short commit SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build frontend image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: false
          load: true
          # Stripe publishable key removed as requested.
          build-args: |
            VITE_API_URL=
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=redstore-frontend
          cache-to: type=gha,mode=max,scope=redstore-frontend

      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: '0'

      - name: Add frontend Trivy report to summary
        if: always()
        run: |
          {
            echo "## Frontend image: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "Report unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-frontend-report
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Block fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_short }}
        run: docker push "$IMAGE_REF"

# FUTURE CD EXTENSION (not active yet):
# Add a promotion/deployment job that depends on BOTH build-scan-backend and
# build-scan-frontend. Only after both succeed, promote or reference the tested
# SHA-tagged images in Render, trigger deployment, and run smoke tests.
# This workflow publishes SHA-tagged images on pushes to main but does not
# deploy to Render or push a :latest tag.