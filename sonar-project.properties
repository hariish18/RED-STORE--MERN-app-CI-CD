# SonarQube Cloud configuration (read by SonarSource/sonarqube-scan-action in the "sonarqube" job)
#
sonar.organization=YOUR_SONAR_ORGANIZATION
sonar.projectKey=YOUR_SONAR_PROJECT_KEY

sonar.projectName=Red Store

# Analyzed code: Express API + React sources
sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/scripts/**,backend/tests/**

# Backend tests (Jest): declared as tests, not as source code
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.js

# Coverage produced by "npm run test:coverage" in the check-backend job (artifact)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Plumbing/config files: excluded from "New Code" coverage calculation
# (server.js = bootstrap + middlewares, product.controller.js = fix logging)

sonar.coverage.exclusions=\
  backend/server.js,\
  backend/controller/product.controller.js,\
  backend/app.js,\
  frontend/**

sonar.sourceEncoding=UTF-8